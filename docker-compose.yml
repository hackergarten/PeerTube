services:
  # MailDev - Email testing tool with web interface
  maildev:
    image: maildev/maildev:latest
    container_name: peertube-maildev
    ports:
      - "1080:1080"  # Web interface
      - "1025:1025"  # SMTP server
    restart: unless-stopped

  peertube:
    build:
      context: .
      dockerfile: ./support/docker/production/Dockerfile
    container_name: peertube
    networks:
      default:
    environment:
      # Database configuration
      PEERTUBE_DB_USERNAME: peertube
      PEERTUBE_DB_PASSWORD: peertube
      PEERTUBE_DB_HOSTNAME: postgres
      PEERTUBE_DB_SSL: "false"

      # Server configuration
      PEERTUBE_WEBSERVER_HOSTNAME: localhost
      PEERTUBE_WEBSERVER_PORT: "9000"
      PEERTUBE_WEBSERVER_HTTPS: "false"
      PEERTUBE_TRUST_PROXY: '["127.0.0.1", "loopback", "172.18.0.0/16"]'

      # Generate with: openssl rand -hex 32
      PEERTUBE_SECRET: changeme_generate_a_secret_with_openssl_rand_hex_32

      # Email configuration - pointing to MailDev
      PEERTUBE_SMTP_HOSTNAME: maildev
      PEERTUBE_SMTP_PORT: "1025"
      PEERTUBE_SMTP_FROM: noreply@peertube.localhost
      PEERTUBE_SMTP_TLS: "false"
      PEERTUBE_SMTP_DISABLE_STARTTLS: "true"
      PEERTUBE_ADMIN_EMAIL: admin@peertube.localhost
    ports:
      - "9000:9000"  # PeerTube web interface
      - "1935:1935"  # RTMP for live streaming
    volumes:
      - ./docker-volume/data:/data
      - ./docker-volume/config:/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      maildev:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: peertube-postgres
    environment:
      POSTGRES_USER: peertube
      POSTGRES_PASSWORD: peertube
      POSTGRES_DB: peertube
    volumes:
      - ./docker-volume/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peertube"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: peertube-redis
    volumes:
      - ./docker-volume/redis:/data
    restart: unless-stopped

networks:
  default:
